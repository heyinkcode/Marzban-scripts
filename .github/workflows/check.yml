name: Fork script checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n marzban.sh marzban-node.sh install_latest_xray.sh
      - name: Verify Fork image targets
        run: |
          grep -q 'ghcr.io/heyinkcode/marzban:latest' marzban.sh
          grep -q 'ghcr.io/heyinkcode/marzban-node:latest' marzban-node.sh
          grep -q 'FETCH_REPO="heyinkcode/Marzban-scripts"' marzban.sh
          grep -q 'FETCH_REPO="heyinkcode/Marzban-scripts"' marzban-node.sh
          grep -q 'ghcr.io/kissow/marzban" || return 1' marzban.sh
          grep -q 'ghcr.io/kissow/marzban-node" || return 1' marzban-node.sh
      - name: Verify resolved Compose image and safe update flow, three rounds
        run: |
          docker compose version
          for round in 1 2 3; do
            echo "Update recognition regression round $round"
            python3 -m unittest discover -s tests -p 'test_*.py' -v
          done
